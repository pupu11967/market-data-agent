name: Daily Market Data Scraper

on:
  # Schedule: 8:30 AM UTC = 4:30 PM MYT (UTC+8), Monday to Friday
  schedule:
    - cron: '30 8 * * 1-5'
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper and Capture Output
        id: scraper
        run: |
          OUTPUT=$(python scraper.py)
          echo "scraper_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT"

      - name: Send to Slack (Optional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          FORMATTED_OUTPUT=$(echo "${{ steps.scraper.outputs.scraper_output }}" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"📊 *Daily Market Closing Data*\\n\\n${FORMATTED_OUTPUT}\"}" \
            $SLACK_WEBHOOK_URL
